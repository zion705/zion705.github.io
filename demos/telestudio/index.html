<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#020818" />
    <meta name="description" content="基于 TeleStudio 数字人 PRD 逐状态还原的可交互产品原型。" />
    <title>TeleStudio 数字人 · PRD 全状态 Demo</title>
    <link rel="stylesheet" href="./styles.css?v=20260726-prd1" />
  </head>
  <body>
    <div class="demo-app">
      <header class="demo-topbar">
        <div class="demo-brand">
          <span aria-hidden="true"></span>
          <div>
            <strong>TeleStudio 数字人</strong>
            <small>PRD 全状态交互原型</small>
          </div>
        </div>
        <div class="topbar-status">
          <span id="stateCounter">01 / 13</span>
          <strong id="topbarState">首页 · 预设形象</strong>
        </div>
        <div class="topbar-actions">
          <button id="fullscreenButton" type="button">全屏</button>
          <a href="./index.html" target="_blank" rel="noreferrer">独立打开 ↗</a>
        </div>
      </header>

      <main class="demo-main">
        <section class="state-viewer" aria-labelledby="stateTitle">
          <div class="prd-canvas" id="prdCanvas">
            <img
              id="stateImage"
              src="../../assets/telestudio/states/home-default.jpg"
              alt="TeleStudio 首页预设数字人状态"
            />
            <div id="hotspotLayer" class="hotspot-layer" aria-label="当前页面可点击区域"></div>
            <span class="canvas-hint">点击高亮区域体验 PRD 跳转</span>
          </div>

          <div class="state-console">
            <div class="state-copy">
              <span id="stateGroup">首页 / 预设直达路径</span>
              <h1 id="stateTitle">选择预设数字人</h1>
              <p id="stateCause">
                用户从前沿探索进入数字人模块，默认展示预设数字人；单击缩略图切换形象，点击“开始对话”直接进入实时交互。
              </p>
            </div>
            <div class="state-actions">
              <button class="console-button console-button--quiet" id="previousButton" type="button">上一个状态</button>
              <button class="console-button console-button--secondary" id="secondaryButton" type="button">编辑已有数字人</button>
              <button class="console-button console-button--primary" id="primaryButton" type="button">新建数字人 →</button>
            </div>
          </div>
        </section>

        <aside class="state-map" aria-label="PRD 页面与状态列表">
          <header>
            <span>PRD STATE MAP</span>
            <strong>3 类页面 · 13 个状态</strong>
            <p>每个节点对应 PRD 中一个独立截图或明确描述的页面状态。</p>
          </header>
          <ol id="stateRail"></ol>
        </aside>
      </main>
    </div>

    <div class="demo-toast" id="demoToast" role="status" aria-live="polite"></div>
    <script src="./app.js?v=20260726-prd1"></script>
  </body>
</html>
